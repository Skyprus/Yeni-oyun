name: APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: APK derle
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk OdaGolf.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OdaGolf-apk
          path: OdaGolf.apk

      - name: Release olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Oda Golf — derleme ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: OdaGolf.apk
          body: |
            Telefona kurmak için aşağıdaki **OdaGolf.apk** dosyasını indir ve aç.
            İlk kurulumda "Bilinmeyen kaynaklardan yükleme" iznini vermen gerekir.
            Commit: ${{ github.sha }}
