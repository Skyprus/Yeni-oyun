name: Oda Golf APK

on:
  push:
    branches: [ccr-5c43ae55-m6uhbl]
    paths: ['oda-golf/**', '.github/workflows/golf.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: APK derle
        working-directory: oda-golf
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../OdaGolf.apk

      - name: Release olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: golf-v${{ github.run_number }}
          name: Oda Golf (Android) — derleme ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          files: OdaGolf.apk
          body: |
            Telefona kurmak için aşağıdaki **OdaGolf.apk** dosyasını indir ve aç.
            İlk kurulumda "Bilinmeyen kaynaklardan yükleme" iznini vermen gerekir.
