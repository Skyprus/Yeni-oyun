name: Android APK

on:
  push:
    branches: [claude/breakable-objects-ar-game-oxt8w9, ccr-5c43ae55-m6uhbl]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../KirGec.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KirGec-apk
          path: KirGec.apk

      - name: Release olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Kır Geç AR (Android) — derleme ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: KirGec.apk
          body: |
            Telefona kurmak için aşağıdaki **KirGec.apk** dosyasını indir ve aç.
            İlk kurulumda "Bilinmeyen kaynaklardan yükleme" iznini vermen gerekir.
            Commit: ${{ github.sha }}
